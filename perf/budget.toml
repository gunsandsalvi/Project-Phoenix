# The budget's ratchets (N8.2, N8.4), read by tools/bench.sh at every step: twenty days from day zero at the committed
# resolution on the build machine. A time or a size may only fall and the cores busy only rise; a step that must raise
# one says so and why. The first values are the measure of 2026-09-28, before the restructure (S1.17–S1.25), with the
# noise of this shared machine: two smokes of one commit differed by 13% in time, 4% in bytes and 30% in faults, so the
# times stand a quarter above the lower measure, the bytes and faults a tenth above the higher, the cores below both. The
# budget itself is 1 000 and 2 000 ms and 4.5 GB; these hold the ground gained on the way to it. The world on the core
# (S1.24, 2026-09-28): the smoke measured a median turn of 2 502 ms, a worst of 7 522 ms, 2 403 bytes a person and
# 20 089 faults a day; the times stand a quarter above, the bytes and faults a tenth. Its day runs on one thread, so
# its cores busy (0.99) stand below the ratchet until the core's day is sharded on the pool (S1.24). Its meetings on
# the pool (S1.24, 2026-09-29): a median turn of 1 637 ms, a worst of 5 147 ms and 1.52 cores busy; the times stand a
# quarter above them, as the noise asks — the same day's tightenings to the bare measures (1 674 and 5 158 ms) left
# no room for it and are raised back to the margin — and the cores busy at 1.40, below the measure.
# The capacities read from the declared table (S1.115, 2026-09-30): two smokes held 1 506 and 1 492 bytes a person,
# the reservations shrunk to the design point; the bytes stand a tenth above the higher.

