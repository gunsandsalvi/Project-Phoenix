# Nine: phx-num's `stop`, the sanctioned panic that carries a contract violation out of the run; the benchmark
# files of phx-num, phx-rand, phx-store and phx-exec, whose gungraun harness prints, exits and passes setups by
# value; phx-store's three modules that hold its `unsafe` (the backing's system calls, the region's typed views, the
# storable marker) and phx-exec's one (affinity, thread ids and the prefetch hint), each lowering the lint for itself
# alone.
