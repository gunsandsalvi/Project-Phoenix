# The month the bench runs: each day's type in order. Ordinary weekdays, a weekend and the Monday after it, a holiday
# block of three closed days before a quarter-end payday (the heavy day), and weekdays again.
[month]
days = ["business", "business", "business", "business", "business", "closed", "closed", "business",
        "business", "business", "business", "business", "closed", "closed", "business", "business",
        "business", "business", "closed", "closed", "closed", "heavy", "business", "business", "business",
        "business", "closed", "closed", "business", "business"]
# A full save after the heavy day and at the month's end, the declared interval's (SET.17), by the days' places from
# nought.
saves = [21, 29]

# Each kind of work: the kernel the bench runs it with, the rows each unit reads where it gathers, and its count on a
# business, a closed and a heavy day (§13.2 through Stage 6; a closed day's and a heavy day's in the ratios of the
# table's times where the table gives only the business day's count).
[[work]]
name = "hazard and need draws, drawn ahead"
kernel = "hazard"
line = "13.2"
counts = [1100000, 1100000, 1100000]
[[work]]
name = "agenda redraws"
kernel = "redraw"
store = "agenda"
line = "13.2"
counts = [240000, 160000, 360000]
[[work]]
name = "agenda gather at 1b"
kernel = "agenda"
store = "agenda"
line = "13.2"
counts = [1500000, 1500000, 1500000]
