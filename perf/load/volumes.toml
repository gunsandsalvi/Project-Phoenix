# The finished world's volumes for the full-load bench (architecture §13, §14.6 item 7): the bytes of each store at the
# design point through Stage 6, and each day type's counts of each kind of work, with the architecture's line each
# comes from. The bench builds the stores whose kernels exist and holds the rest as random words it gathers from; it
# runs every count through its kernel. Its numbers are costs, never the world's. The built stages' counts replace their
# estimates at each gate (`phx measure`).

# The population the bench builds: household agents with their persons and their attachments to shared lines.
[population]
agents = 700000                 # §13.1: household agents at the design point
multiplicity = 170              # §13: the design point's factor under twins
persons_per_agent = 3           # §13.1: persons held in each household agent
attachments_per_agent = 40      # §13.1: 40 rows per household agent, one attachment each

# The settlement the bench builds: holders each with dated rows, two falling due weekly on each business day and four
# once a month on the heavy day, fourteen a holder, so an ordinary weekday reads 1.1 M run heads, scans their rows and
# pays 2.2 M, and the heavy day pays 6.6 M (§13.2: 1.1 M heads, 6.2 M rows, 2 M payments on a business day; 4.4 M on
# the heavy day).
[settlement]
holders = 1100000
daily_rows = 2
monthly_rows = 4
banks = 100
holders_per_line = 256

# Stores held as random words: their bytes through Stage 6, less what the bench builds (§13.1 with each stage's additions).
[[store]]
name = "household agents beyond the built record"
line = "13.1 household agents (672 bytes through Stage 6)"
bytes = 400000000
[[store]]
name = "relationship rows"
line = "13.1 relationship rows, with Stages 2-6"
bytes = 1200000000
[[store]]
