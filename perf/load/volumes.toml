bytes = 452000000
[[store]]
name = "firm and business agents"
line = "13.1, with Stage 6's records"
bytes = 176000000
[[store]]
name = "lines and their stage totals"
line = "13.1, with Stages 2-5"
bytes = 166000000
[[store]]
name = "interned keys and terms"
line = "13.1, with Stages 3-4"
bytes = 151000000
[[store]]
name = "agenda"
line = "13.1"
bytes = 85000000
[[store]]
name = "kind tables of individuals"
line = "13.1, with Stages 4-5"
bytes = 241000000
[[store]]
name = "estates open"
line = "13.1"
bytes = 31000000
[[store]]
name = "markets, records and events"
line = "13.1, with Stages 2-5"
bytes = 246000000
[[store]]
name = "map, network, deposits and stock"
line = "13.1"
bytes = 80000000
[[store]]
name = "directory"
line = "13.1"
bytes = 50000000
[[store]]
