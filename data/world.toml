# The world's constants, the same for every run of a build. Later steps add the population, the map, the countries'
# slots, the regions and the settling length beside the epoch.

[[primitive]]
id = "TIME.epoch"
kind = "ENDOWMENT"
owner = "TIME"
source = "assumed"
source_ref = "Day 1 of the world's day count. It lies early enough that the oldest contracts of a present-day snapshot start on a day of the calendar: pensions in payment to the oldest retirees, long leases, and bonds and mortgages of up to fifty years all begin after it."
value = 1950-01-01

[[primitive]]
id = "TIME.day_zero"
kind = "ENDOWMENT"
owner = "TIME"
source = "assumed"
source_ref = "The opening is a snapshot of the present, dated the last day of the latest year whose annual accounts, censuses and financial statistics are complete in the country-group profiles; day one of the world, the first day settling runs, is the day after."
value = 2025-12-31

