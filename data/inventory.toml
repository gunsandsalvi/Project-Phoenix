owner = "BNK"
first_read = "S0.25"
source = "World Bank Global Findex (account.t.d, fin17a, fin22a)"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/BNK.toml"

[[row]]
id = "GEN.dist.state_pension"
what = "the state pension's age and replacement rate, and who receives old-age and disability benefits"
owner = "SOC"
first_read = "S0.25"
source = "OECD Pensions at a Glance (the developing group's pooled with the emerging members, the owner's decision); ILO SDG 1.3.1 coverage"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/SOC.toml; the developing group's rule is an assumption from nine economies"

[[row]]
id = "GEN.dist.pensions_in_payment"
what = "defined-benefit pensions in payment and pension funds' assets"
owner = "PEN"
first_read = "S0.25"
source = "OECD Pensions at a Glance (occupational transfers' share of the over-65s' income), for the groups that lack it the median of the ten reporting economies nearest in GDP per head; World Bank GFDD pension fund assets to GDP"
