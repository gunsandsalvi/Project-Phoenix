status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/DEM.toml; by region, drawn with the region's households at S0.25c; the partners' age gap (DEM.partner_age_gap) from the World Bank's ages at first marriage, its spread from one economy's couples, and the lone parents who are fathers (DEM.single_father_share) from the same UN database; who each type's extra members are (DEM.household_members) is assumed (F-036)"

