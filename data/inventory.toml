# The declared distributions (spec GEN.2), their shapes from published work and their parameters from the derived
# values by declared mappings.

[[row]]
id = "GEN.dist.population_by_age"
what = "population by age and sex, and deaths by age"
owner = "DEM"
first_read = "S0.25"
source = "UN World Population Prospects 2024: 2023's complete life tables by sex as a Brass logit standard, solved to the drawn life expectancy; population by single age and sex as a standard raked to the drawn shares under 15 and over 65; the sex ratio at birth"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/DEM.toml"

[[row]]
id = "GEN.dist.household_composition"
what = "households by size and composition, and by region"
owner = "DEM"
first_read = "S0.25"
source = "UN DESA Database on Household Size and Composition 2026 (types and sizes as log ratios on the drawn fertility) and on the Living Arrangements of Older Persons 2026; kin from WPP's fertility by year and age and survival (the owner's decision)"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/DEM.toml; by region, drawn with the region's households at S0.25c"

[[row]]
id = "GEN.dist.education_and_skills"
what = "education and skills by age, region and occupation family"
owner = "DEM"
first_read = "S0.25"
source = "Wittgenstein Centre Human Capital Data Explorer v3 (attainment by five-year age and sex, 2020); ILOSTAT employment by ISCO-08 major group and by ICSE-93 status"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/DEM.toml and LAB.toml; skills by occupation family have no source and are drawn from education at S0.25c"

[[row]]
id = "GEN.dist.income"
what = "incomes: a log-normal body with a Pareto top, drawn as the contracts that pay them"
owner = "HH"
first_read = "S0.25"
source = "World Inequality Database sptincj992 shares: a lognormal body and Pareto top above the 90th percentile, the body's sigma solved to the drawn income Gini"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/HH.toml"

[[row]]
id = "GEN.dist.wealth"
what = "household wealth, by preference type"
owner = "HH"
first_read = "S0.25"
source = "World Inequality Database shwealj992 shares: a lognormal body and Pareto top, the body's sigma solved to the drawn top tenth's share; WID imputes almost all emerging and developing economies' wealth"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/HH.toml; by preference type at S1.12"

[[row]]
id = "GEN.dist.firms"
what = "firms by industry and size, with a power-law top; their plant, stocks, debts and owners"
owner = "FRM"
first_read = "S0.16"
source = "OECD Structural and Demographic Business Statistics; World Bank Enterprise Surveys; size tails after Axtell (2001)"
status = "sourced: firms per person employed from the OECD's business statistics (developed; assumed for the other groups, F-015), sizes by Zipf's law after Axtell (2001), plant from the steady state of investment and growth; industries, stocks and owners wait for FRM (S1.03) and S0.25"

[[row]]
id = "GEN.dist.housing"
what = "the housing stock, its tenure and its mortgages"
owner = "HSG"
first_read = "S0.25"
source = "OECD Affordable Housing Database HM1.3 and HC1.2, Eurostat ilc_lvho02: owners with a mortgage, subsidised tenants and the median mortgage and rent burdens, for the groups that lack them the median of the ten reporting economies nearest in GDP per head (the owner's decision)"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/HSG.toml; a mortgage's rate and remaining term take S0.16's placeholder (the owner's decision, F-035)"

[[row]]
id = "GEN.dist.health"
what = "disability by age and sex, and its onset"
owner = "DEM"
first_read = "S0.25"
source = "ILOSTAT population by disability status, sex and age band (mostly the Washington Group's questions); onset derived from the rise in prevalence between bands (the owner's decision)"
status = "sourced: derived by tools/data/derive_pop.py into data/profiles/<level>/gen/DEM.toml; short spells of illness have no source"

[[row]]
id = "GEN.dist.accounts_and_borrowing"
