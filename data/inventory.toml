# The opening's inventory (spec GEN.2, GEN.15): one row per derived value, distribution and present value the
# opening needs, naming its owner, the step that first reads it, and the dataset and table it comes from. A row
# never holds a value. A step that needs a new derived value or mapping adds its row here, in that step's commit,
# before its data. `status` says where the value stands: "profiled", in the country-group profiles of
# data/profiles/<level>/GEN.toml, derived by tools/data/derive.py; "sourced", derived into the file it names; "in hand",
# its published series already in data/sources/raw/ (manifest.json names them), mapped into primitives at the step
# that first reads it; or "mapped", a present value the step that first reads it computes from derived values.

# The derived values (spec GEN.15), drawn at a new game from their level's joint profile.

