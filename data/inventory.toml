# The opening's inventory (spec GEN.2, GEN.15): one row per derived value, distribution and present value the
# opening needs, naming its owner, the step that first reads it, and the dataset and table it comes from. A row
# never holds a value. A step that needs a new derived value or mapping adds its row here, in that step's commit,
# before its data. `status` says whether the source is in hand ("profiled": in the country-group profiles of
# data/profiles/<level>/GEN.toml, derived by tools/data/derive.py), still to be taken at the step that first reads it
# ("to source"), or missing for some groups ("gap"), which is an open item for the owner.

# The derived values (spec GEN.15), drawn at a new game from their level's joint profile.

[[row]]
id = "GEN.life_expectancy"
what = "life expectancy at birth, years"
owner = "GEN"
first_read = "S0.25"
source = "World Bank WDI SP.DYN.LE00.IN"
status = "profiled"

[[row]]
id = "GEN.fertility"
what = "total fertility rate, births per woman"
owner = "GEN"
first_read = "S0.25"
