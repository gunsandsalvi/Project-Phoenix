# The emerging group's statistics agency (spec STA.5): its calendar, samples and revisions. Series in their order:
# the consumer price index, the producer price index, the labour force survey, the money stock, the period life table.

[[primitive]]
id = "STA.release_day"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The business day of the month each series is released on, in the series' order, after the calendars agencies publish: consumer prices near mid-month and producer prices a day or more after them (as the US BLS's CPI and PPI), the labour force early in the month (as the first Friday's Employment Situation), money late in the month (as the Federal Reserve's H.6), later the less developed the agency; assumed until each agency's calendar is read."
value = { axis = [0, 1, 2, 3, 4], values = [12, 14, 8, 18, 12], outside = "refuse" }

[[primitive]]
id = "STA.release_lag"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The months after a period's end each series' first release comes in, in the series' order: the month after for prices and money where agencies publish monthly, longer for surveys and vital registration, and longer the less developed the agency; assumed."
value = { axis = [0, 1, 2, 3, 4], values = [0, 0, 1, 0, 2], outside = "refuse" }

[[primitive]]
id = "STA.sample_share"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The share of its records or households each series samples, in the series' order: a hundredth of retail sales and two hundredths of sales at the factory gate, three thousandths of households for the labour force (the UK's LFS and the US CPS sample between one and two thousandths), all of the banks' reports, and two hundredths of households for vital statistics; assumed."
value = { axis = [0, 1, 2, 3, 4], values = [0.0100, 0.0200, 0.0030, 1.0000, 0.0200], outside = "refuse" }

[[primitive]]
id = "STA.early_returns"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The share of a sample's returns in by a first release: 0.60, near the collection rate of the US BLS's establishment survey at its first estimate for the developed group, lower the less developed the agency; assumed."
value = 0.60

[[primitive]]
id = "STA.revision_months"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The months after a first release its revision, from every return, comes: one, as the US BLS revises its establishment survey's estimate the month after; assumed."
value = 1
