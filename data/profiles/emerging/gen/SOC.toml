source = "assumed"
source_ref = "By sex (female, male), the current normal pension age of a worker entering at 22, years: the median over 8 economies at their latest year 2015-2025, from OECD SDMX API, Pensions at a Glance (DF_PAG); ILOSTAT SDMX API (SDG 1.3.1); World Bank GFDD (fetched 2026-09-24). The group's own members report too few (8), so, as the owner decided, they are pooled with the emerging group's: ARG, BRA, CHN, COL, IDN, MEX, TUR, ZAF; an assumption, recorded. The state pension's rule at its flat point; its earnings-related part waits for SOC."
value = { axis = [0, 1], values = [59.00, 61.00], outside = "refuse" }

