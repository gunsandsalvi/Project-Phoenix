# The emerging group's law (spec GEN.1, NUM.3): every policy a country's law sets. Written by tools/data's derivations; never edited by hand.

[[primitive]]
id = "CB.currency"
kind = "ENDOWMENT"
owner = "CB"
source = "measured"
source_ref = "Currency in circulation as a share of GDP: 6.93%, the median over 47 economies of the group of currency in circulation over GDP, both in national currency at each one's latest year of 2015-2019 reporting both (IMF Monetary and Financial Statistics, central bank survey, S121_L_CIC_IMB_CBS; World Bank NY.GDP.MKTP.CN; fetched 2026-09-27)."
value = "6.93"

[[primitive]]
id = "DEM.age_of_majority"
kind = "POLICY"
owner = "DEM"
decided_by = "parliament"
source = "assumed"
source_ref = "The age at which family law makes a person an adult: 18, as the UN Convention on the Rights of the Child defines childhood and as nearly every country's civil law sets majority."
value = 18

[[primitive]]
id = "DEM.school_leaving_age"
kind = "POLICY"
owner = "DEM"
decided_by = "parliament"
source = "measured"
source_ref = "The age at which compulsory education ends, the theoretical entrance age of primary school plus the duration of compulsory education (World Bank WDI SE.PRM.AGES and SE.COM.DURS, from UNESCO, each country's latest year from 2010 to 2024): 16, the median over the group's 56 countries. Where schooling before primary is compulsory the sum overstates the ending age by up to two years."
value = 16

[[primitive]]
id = "FRM.insolvency_grace_days"
kind = "POLICY"
owner = "FRM"
decided_by = "parliament"
source = "assumed"
source_ref = "Days a firm may leave a payment due unpaid before it is in default of payment: 21, the three weeks within which the managers of an illiquid company must file for insolvency under German law (Insolvenzordnung section 15a); each country's own law is assumed at it until the legal-origin data of the World Bank's resolving-insolvency indicators are mapped to it."
value = 21

[[primitive]]
id = "GEN.units_per_dollar"
kind = "ENDOWMENT"
owner = "GEN"
source = "assumed"
source_ref = "A generated currency has no history against the dollar, so its unit is set worth one international dollar of the profile's GDP per head at the snapshot, and its smallest unit a hundredth of it, as most currencies divide their unit."
value = 100

[[primitive]]
id = "IDX.base"
kind = "POLICY"
owner = "IDX"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The level a price index opens at: 100, the convention of every agency's index reference period."
value = 100.00

[[primitive]]
id = "LAB.full_time_hours"
kind = "POLICY"
owner = "LAB"
decided_by = "parliament"
source = "measured"
source_ref = "The hours a week of a full-time job: the mean hours actually worked by full-time workers, the group's median (ILOSTAT HOW_TEMP_SEX_AGE_JBT_NB, ages 15 and over, fetched 2026-09-26), to the nearest hour."
value = 47

[[primitive]]
id = "LAB.notice_days"
kind = "POLICY"
owner = "LAB"
decided_by = "parliament"
source = "measured"
source_ref = "The days of notice a redundancy dismissal needs: the mean over tenures of 1, 5 and 10 years of the notice period in weeks, the group's median (World Bank, Employing Workers, Redundancy Cost table, EW-Cost.xlsx, fetched 2026-09-26; its round is not stated, believed Doing Business 2020), in calendar days."
value = 30

[[primitive]]
id = "LAB.severance_days_a_year"
kind = "POLICY"
owner = "LAB"
decided_by = "parliament"
source = "measured"
source_ref = "The days of wages owed as severance for each year of service: the severance pay for redundancy at 10 years of tenure in weeks of salary, the group's median (World Bank, Employing Workers, Redundancy Cost table, fetched 2026-09-26), over its 10 years, in calendar days."
value = 13

[[primitive]]
id = "LAB.minimum_wage_share"
kind = "POLICY"
owner = "LAB"
decided_by = "parliament"
source = "measured"
source_ref = "The statutory monthly minimum wage over the mean monthly earnings of employees, the group's median over the economies reporting both in the same year (ILOSTAT EAR_INEE_NOC_NB over EAR_EMTA_SEX_NB, fetched 2026-09-26); about 90% of countries set a minimum (ILO Global Wage Report 2020-21)."
value = "0.5200"

[[primitive]]
id = "SOC.benefit_replacement"
kind = "POLICY"
owner = "SOC"
decided_by = "parliament"
source = "measured"
source_ref = "The benefit's monthly amount as a share of the last wage: 70%, the median initial replacement rate of 17 emerging economies' schemes (Asenjo and Pignatti, ILO Research Department Working Paper 49, 2019)."
value = "0.700"

[[primitive]]
id = "SOC.benefit_months"
kind = "POLICY"
owner = "SOC"
decided_by = "parliament"
source = "measured"
source_ref = "The months the benefit pays: 8, the shorter of the two medians of months at the full previous wage the same study gives (5.4, emerging economies' durations being the shorter, its text says), at the 70% the benefit pays."
value = 8

[[primitive]]
id = "STA.release_day"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The business day of the month each series is released on, in the series' order, after the calendars agencies publish: consumer prices near mid-month and producer prices a day or more after them (as the US BLS's CPI and PPI), the labour force early in the month (as the first Friday's Employment Situation), money late in the month (as the Federal Reserve's H.6), output in the second week (as the UK ONS's monthly GDP), later the less developed the agency; assumed until each agency's calendar is read."
value = { axis = [0, 1, 2, 3, 4, 5], values = [12, 14, 8, 18, 12, 15], outside = "refuse" }

[[primitive]]
id = "STA.release_lag"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The months after a period's end each series' first release comes in, in the series' order: the month after for prices and money where agencies publish monthly, longer for surveys, vital registration and output (the UK ONS publishes a month's GDP about six weeks after it ends), and longer the less developed the agency; assumed."
value = { axis = [0, 1, 2, 3, 4, 5], values = [0, 0, 1, 0, 2, 2], outside = "refuse" }

[[primitive]]
id = "STA.sample_share"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The share of its records or households each series samples, in the series' order: a hundredth of retail sales and two hundredths of sales at the factory gate, three thousandths of households for the labour force (the UK's LFS and the US CPS sample between one and two thousandths), all of the banks' reports, two hundredths of households for vital statistics, and two hundredths of firms' records of sales, purchases and payrolls for the national accounts, as the business surveys behind them; assumed."
value = { axis = [0, 1, 2, 3, 4, 5], values = [0.0100, 0.0200, 0.0030, 1.0000, 0.0200, 0.0200], outside = "refuse" }

[[primitive]]
id = "STA.early_returns"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The share of a sample's returns in by a first release: 0.60, near the collection rate of the US BLS's establishment survey at its first estimate for the developed group, lower the less developed the agency; assumed."
value = 0.60

[[primitive]]
id = "STA.revision_months"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The months after a first release its revision, from every return, comes: one, as the US BLS revises its establishment survey's estimate the month after; assumed."
value = 1

[[primitive]]
id = "TAX.income_band_edges"
kind = "POLICY"
owner = "TAX"
decided_by = "parliament"
source = "measured"
source_ref = "Each income tax band's lower edge as a multiple of the mean wage: the median marginal rates on a single person's wage at 0.67 and 1.00 times the average wage, 15.9% and 21.4%, and the top rate's threshold, 20.6 times the average wage, over the three upper-middle-income economies in the OECD's data (Colombia, Mexico, Turkiye; OECD Taxing Wages 2026 data for 2025, fetched 2026-09-26), with the median top statutory rate over 41 upper-middle-income economies, 25% (PwC Worldwide Tax Summaries, fetched 2026-09-26); free up to 0.45 times, 1 less the median average rate over the marginal rate at the average wage (11.8% over 21.4%)."
value = { axis = [0, 1, 2, 3], values = [0.00, 0.45, 1.00, 20.60], outside = "refuse" }

[[primitive]]
id = "TAX.income_band_rates"
kind = "POLICY"
owner = "TAX"
decided_by = "parliament"
source = "measured"
source_ref = "Each income tax band's marginal rate: the median marginal rates on a single person's wage at 0.67 and 1.00 times the average wage, 15.9% and 21.4%, and the top rate's threshold, 20.6 times the average wage, over the three upper-middle-income economies in the OECD's data (Colombia, Mexico, Turkiye; OECD Taxing Wages 2026 data for 2025, fetched 2026-09-26), with the median top statutory rate over 41 upper-middle-income economies, 25% (PwC Worldwide Tax Summaries, fetched 2026-09-26); free up to 0.45 times, 1 less the median average rate over the marginal rate at the average wage (11.8% over 21.4%)."
