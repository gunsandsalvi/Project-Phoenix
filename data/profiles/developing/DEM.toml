# DEM's country primitives for this development level.

[[primitive]]
id = "DEM.age_of_majority"
kind = "POLICY"
owner = "DEM"
decided_by = "parliament"
source = "assumed"
source_ref = "The age at which family law makes a person an adult: 18, as the UN Convention on the Rights of the Child defines childhood and as nearly every country's civil law sets majority."
value = 18

[[primitive]]
id = "DEM.partner_age_gap"
kind = "ENDOWMENT"
owner = "DEM"
source = "assumed"
source_ref = "A man's age less his female partner's in a couple living together, normal: a mean of 6 years for the group, near the gap between men's and women's mean ages at first marriage that UN DESA's World Marriage Data reports for such economies, and a spread of 5 years, both assumed until the gap is derived from those data (F-036)."
value = { family = "normal", discretisation = "equal_shares", mean = "6", sd = "5" }

[[primitive]]
id = "DEM.school_leaving_age"
kind = "POLICY"
owner = "DEM"
decided_by = "parliament"
source = "measured"
source_ref = "The age at which compulsory education ends, the theoretical entrance age of primary school plus the duration of compulsory education (World Bank WDI SE.PRM.AGES and SE.COM.DURS, from UNESCO, each country's latest year from 2010 to 2024): 15, the median over the group's 64 countries. Where schooling before primary is compulsory the sum overstates the ending age by up to two years."
value = 15

[[primitive]]
id = "DEM.ideal_children"
kind = "PREFERENCE"
owner = "DEM"
source = "assumed"
source_ref = "A household's ideal number of children: a mean of 4.5, the median over 48 lower-middle- and low-income countries of the DHS indicator of women's ideal number of children (women 15 to 49, each country's latest survey from 2010 on), the last value standing for six or more. The shares over the numbers are assumed about that mean, giving a mean of 4.58, until they are derived from the surveys' own distributions."
value = { family = "discrete", discretisation = "equal_shares", values = [2, 3, 4, 5, 6], shares_ppm = [80000, 140000, 250000, 180000, 350000] }
