source_ref = "Expected living children of a parent of each age 15-100 (rows) by the children's age band from its first age (0-19, 20-39, 40-59, 60 and over): for a mother of that age, the births her cohort had at each age 15-49 by that year's age-specific fertility (the first year's, 1950, for years before it), each child surviving to its age now by its birth year's under-five mortality and beyond five by the 2023 life table, both sexes; the median over the group's 72 economies, from UN DESA, World Population Prospects 2024, standard projections (medium variant), CSV files (fetched 2026-09-24). As the owner decided, a parent's children in other households are these less those living with it; a father is read at his own age, as no source gives fathers' fertility by age."
