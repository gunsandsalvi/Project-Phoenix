# The developed group's labour law and labour-market endowment: hours, notice, severance, the minimum wage, the opening's
# unemployment and the tenure of its jobs. Medians over the group's economies (World Bank income groups, as the
# population's data are grouped) at their latest observation 2010-2025.

[[primitive]]
id = "LAB.full_time_hours"
kind = "POLICY"
owner = "LAB"
decided_by = "parliament"
source = "measured"
source_ref = "The hours a week of a full-time job: the mean hours actually worked by full-time workers, the group's median (ILOSTAT HOW_TEMP_SEX_AGE_JBT_NB, ages 15 and over, fetched 2026-09-26), to the nearest hour."
value = 42

[[primitive]]
id = "LAB.part_time_hours"
kind = "ENDOWMENT"
owner = "LAB"
source = "measured"
source_ref = "The hours a week of a part-time job: the mean hours actually worked by part-time workers, the group's median (ILOSTAT HOW_TEMP_SEX_AGE_JBT_NB, ages 15 and over, fetched 2026-09-26), to the nearest hour."
value = 22

[[primitive]]
