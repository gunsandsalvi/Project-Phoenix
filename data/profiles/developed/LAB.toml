owner = "LAB"
source = "measured"
source_ref = "The employees by the years since their job began (axis: each band's first year, and last the end of the last band): the OECD's job tenure of dependent employees (DF_TENURE_FREQ, the median over the group's 38 economies at their latest year, mostly 2024): under a year 15.7%, one to five 30.2%, five to ten 19.3%, ten and more 33.8%; the last band ends at 31 years so the bands' mean is the group's mean tenure of 9.4 years (DF_TENURE_AVE)."
