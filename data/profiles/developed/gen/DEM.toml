[[primitive]]
id = "DEM.income_shape"
kind = "ENDOWMENT"
owner = "DEM"
source = "measured"
source_ref = "The group's shape of income: a lognormal body with a Pareto top above its 90th percentile (the generator's lognormal_pareto_tail). Each economy's body sigma is solved from the bottom half's share of the bottom 90%'s, Phi(-s)/Phi(z90 - s), and its Pareto exponent from the top 1%'s share of the top 10%'s, 0.1^(1 - 1/alpha); the medians over the group's 79 economies at their latest year 2010-2025 (0 left out, their bottom half holding nothing or less, or their top no finite mean), WID sptincj992, pre-tax national income, equal-split adults, from World Inequality Database, bulk download (fetched 2026-09-24). The body's median is one; the mapping keeps the exponent and the top's start at the body's 90th percentile, solves the body's sigma so that the whole distribution's Gini is the country's drawn GEN.income_gini, and scales it to the country's mean. The drawn Gini is the World Bank's, from surveys of disposable income or consumption, where WID's shares are of pre-tax income: the mapping takes the shape from one and the level from the other."
value = { family = "lognormal_pareto_tail", discretisation = "equal_shares", mu = "0", sigma = "0.890253", threshold = "3.129599", alpha = "1.858740" }

