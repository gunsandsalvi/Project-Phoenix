# The developed group's state pension and benefit coverage (spec GEN.2, SOC), derived by tools/data/derive_pop.py; never edited by hand.

[[primitive]]
id = "SOC.pension_age"
kind = "POLICY"
owner = "SOC"
source = "measured"
source_ref = "By sex (female, male), the current normal pension age of a worker entering at 22, years: the median over 41 economies at their latest year 2015-2025, from OECD SDMX API, Pensions at a Glance (DF_PAG); ILOSTAT SDMX API (SDG 1.3.1); World Bank GFDD (fetched 2026-09-24). The state pension's rule at its flat point; its earnings-related part waits for SOC."
