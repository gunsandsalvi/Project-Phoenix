# The business-day calendar of a developed country's template, shaped like England and Wales' bank holidays.

[[primitive]]
id = "TIME.weekend"
kind = "ENDOWMENT"
owner = "TIME"
source = "measured"
source_ref = "Banks and markets in England and Wales close on Saturdays and Sundays (Bank of England settlement calendar)."
value = ["Saturday", "Sunday"]

[[primitive]]
id = "TIME.holidays"
kind = "ENDOWMENT"
owner = "TIME"
source = "measured"
source_ref = "Banking and Financial Dealings Act 1971, s. 1 and Sch. 1 (Easter Monday, the last Mondays of May and August, 26 December and its substitute); New Year's Day and the early May bank holiday by annual royal proclamation under s. 1(3); Good Friday and Christmas Day as common-law holidays, with the substitute days the proclamations set when they fall at a weekend."
value = [
  { name = "New Year's Day", rule = "fixed", month = 1, day = 1 },
  { name = "Good Friday", rule = "easter", offset_days = -2 },
  { name = "Easter Monday", rule = "easter", offset_days = 1 },
  { name = "Early May bank holiday", rule = "nth_weekday", month = 5, weekday = "Monday", n = 1 },
  { name = "Spring bank holiday", rule = "nth_weekday", month = 5, weekday = "Monday", n = -1 },
  { name = "Summer bank holiday", rule = "nth_weekday", month = 8, weekday = "Monday", n = -1 },
  { name = "Christmas Day", rule = "fixed", month = 12, day = 25 },
  { name = "Boxing Day", rule = "fixed", month = 12, day = 26 },
  { name = "New Year's Day, substitute", rule = "substitute", of = "New Year's Day", when_on = ["Saturday", "Sunday"] },
  { name = "Christmas Day, substitute", rule = "substitute", of = "Christmas Day", when_on = ["Saturday", "Sunday"] },
  { name = "Boxing Day, substitute", rule = "substitute", of = "Boxing Day", when_on = ["Saturday", "Sunday"] },
]
