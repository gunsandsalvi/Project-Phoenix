owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The months after a period's end each series' first release comes in, in the series' order: the month after for prices and money where agencies publish monthly, longer for surveys, vital registration and output (the UK ONS publishes a month's GDP about six weeks after it ends), and longer the less developed the agency; assumed."
value = { axis = [0, 1, 2, 3, 4, 5], values = [0, 0, 0, 0, 1, 1], outside = "refuse" }

