[[primitive]]
id = "STA.release_day"
kind = "POLICY"
owner = "STA"
decided_by = "statistics agency"
source = "assumed"
source_ref = "The business day of the month each series is released on, in the series' order, after the calendars agencies publish: consumer prices near mid-month and producer prices a day or more after them (as the US BLS's CPI and PPI), the labour force early in the month (as the first Friday's Employment Situation), money late in the month (as the Federal Reserve's H.6), output in the second week (as the UK ONS's monthly GDP), later the less developed the agency; assumed until each agency's calendar is read."
value = { axis = [0, 1, 2, 3, 4, 5], values = [10, 11, 3, 16, 12, 8], outside = "refuse" }

[[primitive]]
id = "STA.release_lag"
