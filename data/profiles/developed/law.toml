[[primitive]]
id = "DEM.heirless_to"
kind = "POLICY"
owner = "DEM"
decided_by = "parliament"
source = "assumed"
source_ref = "Where an estate with no heir passes: to the state, as the law of intestate succession in civil-law countries (the German Civil Code, section 1936) and escheat or bona vacantia in common-law countries (the English Administration of Estates Act 1925, section 46(1)(vi)) provide; the state's institution that takes it is its treasury, the kind the world's state holds its finances in."
