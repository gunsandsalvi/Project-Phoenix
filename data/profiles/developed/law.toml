# The developed group's law (spec GEN.1, NUM.3): every policy a country's law sets. Written by tools/data's derivations; never edited by hand.

[[primitive]]
id = "CB.currency"
kind = "ENDOWMENT"
owner = "CB"
source = "measured"
source_ref = "Currency in circulation as a share of GDP: 5.61%, the median over 34 economies of the group of currency in circulation over GDP, both in national currency at each one's latest year of 2015-2019 reporting both (IMF Monetary and Financial Statistics, central bank survey, S121_L_CIC_IMB_CBS; World Bank NY.GDP.MKTP.CN; fetched 2026-09-27)."
value = "5.61"

[[primitive]]
id = "DEM.age_of_majority"
kind = "POLICY"
owner = "DEM"
decided_by = "parliament"
source = "assumed"
source_ref = "The age at which family law makes a person an adult: 18, as the UN Convention on the Rights of the Child defines childhood and as nearly every country's civil law sets majority."
value = 18

[[primitive]]
id = "DEM.school_leaving_age"
kind = "POLICY"
owner = "DEM"
decided_by = "parliament"
source = "measured"
source_ref = "The age at which compulsory education ends, the theoretical entrance age of primary school plus the duration of compulsory education (World Bank WDI SE.PRM.AGES and SE.COM.DURS, from UNESCO, each country's latest year from 2010 to 2024): 17, the median over the group's 77 countries. Where schooling before primary is compulsory the sum overstates the ending age by up to two years."
value = 17

[[primitive]]
id = "FRM.insolvency_grace_days"
kind = "POLICY"
owner = "FRM"
decided_by = "parliament"
source = "assumed"
source_ref = "Days a firm may leave a payment due unpaid before it is in default of payment: 21, the three weeks within which the managers of an illiquid company must file for insolvency under German law (Insolvenzordnung section 15a); each country's own law is assumed at it until the legal-origin data of the World Bank's resolving-insolvency indicators are mapped to it."
value = 21

[[primitive]]
id = "GEN.units_per_dollar"
kind = "ENDOWMENT"
owner = "GEN"
source = "assumed"
source_ref = "A generated currency has no history against the dollar, so its unit is set worth one international dollar of the profile's GDP per head at the snapshot, and its smallest unit a hundredth of it, as most currencies divide their unit."
value = 100

