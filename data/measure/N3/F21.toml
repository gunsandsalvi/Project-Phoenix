id = "F21"
version = 2
title = "Volatility clusters"
series = ["daily closes of listed shares and the market index"]
unit = "stock-day"
estimator = { id = "corr", version = 1 }
filter = { absolute_returns = true, lags = [1, 5, 10, 20, 50, 100], decay = "power law fitted over the lags" }
window = "all days of play"
sample = "listed shares and the index, per country"
pooled = true
credit = ["B"]
min_years = 3
suspects = ["DLR", "FND", "L2", "L11"]
earlier_reads = []

[[benchmark]]
statistic = "autocorrelation of absolute daily returns at lag one"
range = [0.0, 0.5]
source = "Cont (2001)"
source_ref = "The autocorrelation of absolute returns is positive and decays slowly (fact 8); the source gives no value at lag one, so the range asks only that it be positive."

[[benchmark]]
statistic = "power-law decay exponent of that autocorrelation"
range = [0.15, 0.6]
source = "Cont (2001)"
source_ref = "The autocorrelation of absolute returns decays as a power of the lag with an exponent between 0.2 and 0.4 (fact 8, equation 17); the range adds a margin at each end."

[[benchmark]]
statistic = "correlation of returns with future volatility"
range = [-0.5, -0.01]
source = "Cont (2001); Black (1976)"
source_ref = "The leverage effect: falling prices are followed by higher volatility."
