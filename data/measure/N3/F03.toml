id = "F03"
version = 2
title = "Comovement with output over the cycle"
series = ["STA real output, fixed investment, consumption of non-durables and services, employment and the unemployment rate, quarterly"]
unit = "country-quarter"
estimator = { id = "hp", version = 1 }
filter = { lambda = 1600, log = true, unemployment = "level" }
window = "all quarters of play"
sample = "every quarter of play after settling, per country"
pooled = false
credit = ["B"]
min_years = 10
suspects = ["LAB", "HH", "CAP"]
earlier_reads = []

[[benchmark]]
statistic = "correlation of cyclical consumption with cyclical output"
range = [0.5, 0.95]
source = "Stock and Watson (1999)"
source_ref = "Contemporaneous correlation with output: non-durables and services consumption 0.87, total consumption 0.90 (Stock and Watson, Table 2)."

[[benchmark]]
statistic = "correlation of cyclical fixed investment with cyclical output"
range = [0.6, 0.97]
source = "Stock and Watson (1999)"
source_ref = "Contemporaneous correlation of fixed investment with output: 0.89 (Stock and Watson, Table 2)."

[[benchmark]]
statistic = "correlation of cyclical employment with cyclical output"
range = [0.5, 0.95]
source = "Stock and Watson (1999)"
source_ref = "Contemporaneous correlation of employment with output: 0.81, peaking at 0.92 when employment lags output by a quarter (Stock and Watson, Table 2)."

[[benchmark]]
statistic = "correlation of the cyclical unemployment rate with cyclical output"
range = [-0.95, -0.5]
source = "Stock and Watson (1999)"
source_ref = "Contemporaneous correlation of the unemployment rate with output: -0.89, -0.93 at a lag of a quarter (Stock and Watson, Table 2)."
