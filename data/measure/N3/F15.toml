id = "F15"
version = 2
title = "Unemployment spells and duration dependence"
series = ["persons' labour-market states, tracers"]
unit = "spell"
estimator = { id = "survival", version = 1 }
filter = { spells = "begun after settling", long_term_months = 12, hazard_at_months = [1, 12] }
window = "every spell begun in play"
sample = "unemployment spells, per country"
pooled = false
credit = ["B"]
min_years = 3
suspects = ["LAB", "POP", "SOC"]
earlier_reads = []

[[benchmark]]
statistic = "long-term share of the unemployed (a year and more)"
range = [0.1, 0.7]
source = "OECD Labour Force Statistics, incidence of long-term unemployment"
source_ref = "OECD incidence of unemployment of a year or more, both sexes, all ages: the US 12.7 per cent (2019) and 12.2 (2024); in 2024 France 23.1, Germany 27.8, Spain 33.5, Belgium 36.4, Italy 52.0, Greece 54.9 and Slovakia 65.1; Greece 70.2 in 2019."

[[benchmark]]
statistic = "exit hazard at twelve months over exit hazard at one month"
range = [0.1, 1.0]
source = "Machin and Manning (1999), Handbook of Labor Economics 3C; Kroft, Lange and Notowidigdo (2013), Quarterly Journal of Economics 128(3)"
source_ref = "Neither source gives the ratio: Kroft, Lange and Notowidigdo find the callback rate falls significantly with the spell's length, most of the fall in the first eight months, and Machin and Manning that exit rates fall with duration. The range asks only that the hazard at twelve months be below the first month's."
