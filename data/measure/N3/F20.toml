id = "F20"
version = 2
title = "Returns: fat tails, no linear memory"
series = ["daily closes of listed shares and the market index (MKT, IDX)"]
unit = "stock-day"
estimator = { id = "tail", version = 1 }
filter = { method = "Hill", tail_share = 0.05, standardised = false, lags = [1, 5, 10], ljung_box_lags = 10 }
window = "all days of play"
sample = "listed shares and the index, per country"
pooled = true
credit = ["B"]
min_years = 2
suspects = ["EQY", "DLR", "FND", "VAL", "L2", "L11"]
earlier_reads = []

[[benchmark]]
statistic = "Hill tail index of daily returns"
range = [2.0, 5.0]
source = "Cont (2001), Quantitative Finance 1(2)"
source_ref = "The tail index of daily returns is higher than two and less than five across markets (stylised fact 2; its section 4.2 gives shape parameters of 0.2 to 0.4); returns standardised by their volatility have lighter tails (fact 7)."

[[benchmark]]
statistic = "autocorrelation of daily returns at lag one"
range = [-0.1, 0.1]
source = "Cont (2001)"
source_ref = "Linear autocorrelations of returns are often insignificant except at intraday scales of about twenty minutes (fact 1). The source gives no bound; the range asks only for autocorrelations near nought."
