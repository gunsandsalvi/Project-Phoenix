id = "F11"
version = 2
title = "Young firms exit more; survivors grow"
series = ["foundings and endings by firm age (FRM records)", "employment of survivors"]
unit = "cohort"
estimator = { id = "survival", version = 1 }
filter = { cohorts = "founded after settling", ages = [1, 2, 3, 4, 5, 10] }
window = "cohorts founded in play"
sample = "firms founded after settling, per country"
pooled = false
credit = ["B"]
min_years = 6
suspects = ["FRM", "BNK", "TCR", "L3"]
earlier_reads = []

[[benchmark]]
statistic = "five-year survival of a founding cohort"
range = [0.3, 0.65]
source = "US Census Business Dynamics Statistics; Haltiwanger, Jarmin and Miranda (2013), Review of Economics and Statistics 95(2)"
source_ref = "From the Business Dynamics Statistics' firm-age table, firms aged five in year t+5 over firms aged zero in year t average 0.47 (0.43 to 0.54) for the cohorts of 1978-2017; Haltiwanger, Jarmin and Miranda find exits remove about 47 per cent of start-ups' jobs within five years."

[[benchmark]]
statistic = "exit rate at age one over exit rate at ages ten and above"
range = [1.3, 6.0]
source = "US Census Business Dynamics Statistics, firm age table (bds2022_fa)"
source_ref = "Firm exit rates in the Business Dynamics Statistics are 21 to 29 per cent at age one and 5 to 7 per cent at ages eleven and above over 2003-2022, a ratio of about 3 to 4."
