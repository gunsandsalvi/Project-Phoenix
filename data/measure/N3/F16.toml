id = "F16"
version = 2
title = "Credit over the cycle"
series = ["STA bank credit to households and firms", "STA real output", "ACC banks' and firms' leverage"]
unit = "country-quarter"
estimator = { id = "corr", version = 1 }
filter = { filter = "hp", lambda = 1600, credit = "real, log", before_peak = "the expansion" }
window = "all quarters of play"
sample = "every quarter of play after settling, per country"
pooled = false
credit = ["B"]
min_years = 15
suspects = ["BNK", "BCP", "L5"]
earlier_reads = []

[[benchmark]]
statistic = "concordance of credit and output cycles: the share of quarters both are in the same phase"
range = [0.6, 0.95]
source = "Claessens, Kose and Terrones (2012), Journal of International Economics 87(1)"
source_ref = "Output and credit cycles are in the same phase with a median concordance of 0.81 (mean 0.78) across 44 countries, significantly concordant in 60 per cent of them (IMF Working Paper 11/88, the article's working paper)."

[[benchmark]]
statistic = "excess credit: the growth of credit over output a year in the expansion before a peak less its mean over expansions, percentage points of output a year"
range = [0.0, 1.5]
source = "Jordà, Schularick and Taylor (2013), Journal of Money, Credit and Banking 45(s2)"
source_ref = "Excess credit in the expansion before a recession averages 0.47 percentage points a year over all recessions (standard deviation 2.17), 1.26 before financial recessions and 0.24 before normal ones (NBER Working Paper 17621, Table 3)."
