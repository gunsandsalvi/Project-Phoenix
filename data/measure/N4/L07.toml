id = "L07"
version = 2
title = "The downgrade loop"
first_link = "downgrades across a mandate boundary (RAT records)"
traces = ["mandate sales, capital charges, haircuts and issuers' funding costs"]
min_years = 5
suspects = ["RAT", "CRD", "FND", "INS"]
estimator = { id = "event", version = 1 }

[[benchmark]]
statistic = "abnormal price change of bonds downgraded across the boundary"
series = "CRD prints"
horizon = "the month of the downgrade"
sign = "negative"
range = [-0.15, -0.005]
source = "Ellul, Jotikasthira and Lundblad (2011), Journal of Financial Economics 101(3)"
source_ref = "Median cumulative abnormal returns of bonds downgraded to speculative grade reach about -10 per cent two weeks before the downgrade, and about -2 per cent remains by week twenty; bonds held by insurers of low capital fall more than 14 per cent."

[[benchmark]]
statistic = "probability of a further downgrade after a downgrade over after no rating change"
series = "RAT records"
horizon = "one year"
sign = "positive"
range = [1.0, 10.0]
source = "Lando and Skødeberg (2002), Journal of Banking and Finance 26(2-3)"
source_ref = "Rating transitions show significant non-Markov effects, especially for downgrades: a recent downgrade raises the chance of another. The source's magnitude could not be read; the range asks only that the ratio exceed one."
