id = "L05"
version = 2
title = "The credit and housing cycle"
first_link = "changes in collateral values (HSG prices, marks)"
traces = ["published lending standards"]
min_years = 15
suspects = ["BNK", "HSG", "BCP"]
estimator = { id = "event", version = 1 }

[[benchmark]]
statistic = "correlation of credit growth with earlier house-price growth, at its peak lag"
series = "STA credit to households; HSG prices"
horizon = "up to eight quarters"
sign = "positive"
range = [0.0, 0.9]
source = "Goodhart and Hofmann (2008), Oxford Review of Economic Policy 24(1)"
source_ref = "A panel VAR of 17 industrial countries over 1970-2006 finds a significant multidirectional link between house prices, money and credit, house prices influencing credit; the source gives no correlation, so the range asks only that it be positive."

[[benchmark]]
statistic = "foreclosure sales' share of transactions after house-price peaks over before"
series = "dwelling transactions by cause (HSG)"
horizon = "eight quarters either side of a peak"
sign = "positive"
range = [2.0, 20.0]
source = "Campbell, Giglio and Pathak (2011), American Economic Review 101(5)"
source_ref = "In Massachusetts foreclosure-related sales were negligible in 1987 and under one per cent of sales in the mid-2000s, and rose to 9.7 per cent in 1993 and 12.7 per cent in the first quarter of 2008, after the price peaks (NBER Working Paper 14866)."
