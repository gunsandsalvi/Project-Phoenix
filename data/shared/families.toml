# Every family's fixed 8-bit code: contract families and the dated reasons the wheel files. A save names a family by
# its code, so a code is permanent: a planned row holds its code before its step is built, a retired row keeps its code,
# and no code is reissued. Code 255 is holdings'. `step` is the step that settles the row: the one that declares a
# planned family, or puts a declared one on the contract store or retires it (SOV.bills onto instruments at S1.282,
# TAX.collected and TAX.collected_public onto tax_payables at S1.270).

