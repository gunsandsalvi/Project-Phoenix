# GEO's map: its resolution, the SHAPEs its relief is generated with, the terrain classes, and the construction
# conditions. The climate tables are GEO_climate.toml's, the hazards' and deposits' GEO_hazards.toml's.

[[primitive]]
id = "GEO.tile_m"
kind = "RESOLUTION"
owner = "GEO"
source = "assumed"
source_ref = "The owner's map (plan §12, 2026-09-23): tiles of 10 km, the same map subdivided at a finer resolution."
value = 10000

[[primitive]]
id = "GEO.zones"
kind = "RESOLUTION"
owner = "GEO"
source = "assumed"
source_ref = "The plan's zones (S0.13): 2,000 across the three countries, about 20 tiles each, the place at which members of cells are carried."
value = 2000

[[primitive]]
id = "GEO.zone_min_tiles"
kind = "RESOLUTION"
owner = "GEO"
source = "assumed"
source_ref = "A zone of fewer than 5 tiles (500 km2) is too small to hold a town and its hinterland; the construction condition rejects a map that makes one."
value = 5

[[primitive]]
id = "GEO.zone_max_tiles"
kind = "RESOLUTION"
owner = "GEO"
source = "assumed"
source_ref = "A zone of more than 150 tiles (15,000 km2), seven times the mean, is too large for its members to share one place; the construction condition rejects a map that makes one."
value = 150

[[primitive]]
id = "GEO.sea_share"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Four tenths of the rectangle under the sea, so the land is one continent with coasts on every side and room for islands."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.4

[[primitive]]
id = "GEO.base_cells"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Four cells across the coarsest octave: a continent with a few large landforms rather than one dome or scattered islands."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 4

[[primitive]]
id = "GEO.octaves"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Seven octaves, the finest about a tile across, so the relief varies from tile to tile."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 7

[[primitive]]
id = "GEO.roughness"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Each octave half the last's weight: the fractal relief of real terrain, whose spectra fall by about half an octave's amplitude per doubling of frequency."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.5

[[primitive]]
id = "GEO.falloff"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "The height's fall from the centre that keeps the sea at the map's edges."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 1.5

[[primitive]]
id = "GEO.mainland_floor_percent"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "At least four fifths of a country's land on the mainland."
shape = "standing:a construction condition: a country scattered over islands has no land market or road across it, and no mechanism joins them"
value = 80

[[primitive]]
id = "GEO.terrain_max_elevation"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Plains up to 200 m, hills to 800 m, uplands to 2,000 m, mountains above: the classes of the usual physiographic divisions."
shape = "standing:terrain classes are how the relief is read by exposure and deposits; no mechanism classifies ground"
value = { axis = [0, 1, 2, 3], values = [200, 800, 2000, 32767], outside = "refuse" }

[[primitive]]
id = "GEO.terrain_max_relief"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "A plain's heights within its tile span at most 100 m, hills' 300 m, uplands' 800 m; rougher ground is mountains: relief within about 10 km, the measure of the usual landform classifications (plains, hills, plateaus, mountains)."
shape = "standing:terrain classes are how the relief is read by exposure and deposits; no mechanism classifies ground"
value = { axis = [0, 1, 2, 3], values = [100, 300, 800, 32767], outside = "refuse" }

[[primitive]]
id = "GEO.coast_m"
kind = "TECHNOLOGY"
owner = "GEO"
source = "assumed"
source_ref = "Within 20 km of the sea a tile takes the coastal exposure: storm surge and coastal flooding reach that far inland on low coasts."
value = 20000

[[primitive]]
id = "GEO.metres_per_degree"
kind = "ENDOWMENT"
owner = "GEO"
source = "measured"
source_ref = "The Earth's mean radius, 6,371,008.8 m (IUGG; Moritz, Geodetic Reference System 1980), times pi over 180: 111,195 m to a degree of latitude."
value = 111195

[[primitive]]
id = "GEO.south_latitude"
kind = "ENDOWMENT"
owner = "GEO"
source = "assumed"
source_ref = "The owner's placement of the map (plan §12, 2026-09-24): its south edge at 35°N, so the map spans 35°N to 58.3°N, a temperate continent like Europe's, from Mediterranean to boreal."
value = 35.0

[[primitive]]
id = "GEO.relief_cells_per_tile"
kind = "RESOLUTION"
owner = "GEO"
source = "assumed"
source_ref = "Four relief cells across a tile, 2.5 km each: fine enough for a tile's relief and its rivers' valleys to be read within it, and for erosion to cut valleys narrower than a tile."
value = 4

[[primitive]]
id = "GEO.plates"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Fourteen plates under a continent of 2,600 km: Europe's is a mosaic of a dozen or so blocks and microplates, whose sutures are its mountain belts."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 14

[[primitive]]
id = "GEO.plate_belt"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "A boundary's belt reaches about 90 km each side, the half-width of a mountain belt such as the Alps."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.035

[[primitive]]
id = "GEO.plate_weight"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "The crust's level weighs about half the fractal relief, so plates set the continent's shape and the noise its detail."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.45

[[primitive]]
id = "GEO.mountain_weight"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Converging plates raise belts that rise above the continent's own relief, as young ranges do."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.9

[[primitive]]
id = "GEO.warp"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "The plane warped by up to about 150 km before the relief is read: coasts and belts bend and fold rather than following the noise's lattice."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.06

[[primitive]]
id = "GEO.erosion_passes"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Eight passes of fluvial erosion: enough for the main rivers to cut their valleys and for the drainage to organise into basins."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 8

[[primitive]]
id = "GEO.erosion_rate"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "The stream-power rate per pass, in the raw relief's units: large rivers cut down to near their outlet's level while small streams barely incise."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.004

[[primitive]]
id = "GEO.erosion_area_exponent"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Incision grows with the square root of the area drained: the stream-power law's usual exponent (m/n about 0.5; Whipple and Tucker 1999)."
shape = "standing:the ground is given: plate tectonics, erosion and the making of relief are outside the world"
value = 0.5

[[primitive]]
id = "GEO.river_tiles"
kind = "RESOLUTION"
owner = "GEO"
source = "assumed"
source_ref = "A tile carries a river when 25 tiles (2,500 km2) drain through it: a river of regional note, wide enough to need bridges and to flood its plain."
value = 25

[[primitive]]
id = "GEO.rugged_m"
kind = "TECHNOLOGY"
owner = "GEO"
source = "assumed"
source_ref = "400 m of relief doubles the cost of crossing a tile: rugged ground slows movement and settlement, so borders tend to follow it."
value = 400

[[primitive]]
id = "GEO.river_crossing_m"
kind = "TECHNOLOGY"
owner = "GEO"
source = "assumed"
source_ref = "Crossing onto a river costs as much as 20 km of plain: before bridges, rivers bounded lands and parishes."
value = 20000

[[primitive]]
id = "GEO.partition_rounds"
kind = "RESOLUTION"
owner = "GEO"
source = "assumed"
source_ref = "Each round moves a border by the rows its parts are off, so a few rounds settle it; the rest are spare."
value = 48

[[primitive]]
id = "GEO.share_tolerance_per_mille"
kind = "SHAPE"
owner = "GEO"
source = "assumed"
source_ref = "Each country's land within 5% of its share, and each region within 5% of its country's mean."
shape = "standing:a construction condition: regions of like size, as GEO.3 asks, and countries holding their shares of the land, which no mechanism of the world adjusts"
value = 50
