# The representation (spec REP.40, Appendix E 44): every household and small firm an agent, the full population as
# agents of one multiplicity (twins) or one factor-th of it as agents of one party each (a small world). Twins is the
# default; `phx run --representation twins:K|small:K` sets both for a build run.

[[primitive]]
id = "REP.multiplicity"
kind = "RESOLUTION"
owner = "REP"
source = "assumed"
source_ref = "Resolution (spec REP.40, N8.5): the twins every household and small firm agent stands for under the default representation, twins. The owner's setting (plan §12, 2026-09-25): 170, the design point of architecture §13, about 0.95 million agents for three countries of 300 million people; a factor of 20 exceeded the reserved address space (F-075)."
value = 170

[[primitive]]
id = "REP.population_divisor"
kind = "RESOLUTION"
owner = "REP"
source = "assumed"
source_ref = "Resolution (spec REP.40): what the setup's total population is divided by before the countries are derived. One under twins, the full population; the factor under a small world."
value = 1
