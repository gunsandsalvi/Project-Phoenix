# FRM's opening: the law firms' sizes follow, the promotion rank that makes the largest individuals, the deposits
# they hold and the wear of their plant. The firm density is each profile's (data/profiles/<level>/FRM.toml).

[[primitive]]
id = "FRM.size_exponent"
kind = "ENDOWMENT"
owner = "FRM"
source = "measured"
source_ref = "Axtell (2001), Zipf distribution of U.S. firm sizes, Science 293: the share of firms larger than a size falls as the size to the power 1.059 (s.e. 0.054), over the whole census of U.S. firms by employees (owner's decision, plan §12, 2026-09-24)."
value = "1.059"

[[primitive]]
id = "FRM.rank_per_million"
kind = "RESOLUTION"
owner = "FRM"
source = "assumed"
source_ref = "The promotion rank for firms: the 150 largest firms per million people are individuals, the rest a stratum, until the budget is measured on the device and the resolution is set by it."
value = 150

[[primitive]]
id = "FRM.deposit_share"
kind = "ENDOWMENT"
owner = "FRM"
source = "assumed"
source_ref = "Non-financial corporations hold about a quarter of the deposits of the euro area's banks (ECB, MFI balance sheet statistics, deposits by sector), taken for every country until each country's sectoral deposits are sourced."
value = "0.25"

[[primitive]]
id = "FRM.depreciation"
kind = "TECHNOLOGY"
owner = "FRM"
source = "assumed"
source_ref = "Plant wears out at about 5% a year, near the average rate of the capital stock in national accounts (Penn World Table's average depreciation rate is 4-5%), until the classes of capital goods are declared with their own lives."
value = "0.05"

[[primitive]]
id = "FRM.size_classes"
kind = "RESOLUTION"
owner = "FRM"
source = "assumed"
source_ref = "The first employments of the size classes a small firm's key holds it in: Eurostat's structural business statistics' classes by persons employed (one, 2-9, 10-19, 20-49, 50-249, 250 and more), the last running to the smallest firm the promotion rank admits. A resolution setting, changed by measuring the budget (N8.5)."
value = [1, 2, 10, 20, 50, 250]

[[primitive]]
id = "FRM.cell_budget"
kind = "RESOLUTION"
owner = "FRM"
source = "assumed"
source_ref = "The most small-firm cells the representation keeps before tolerance control widens their steps: the architecture's design point of a quarter of a million firm and business cells (N8), set by measuring the budget."
value = 250000
