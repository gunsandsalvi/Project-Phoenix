# DEM's shared primitives: how households are represented.

[[primitive]]
id = "DEM.age_classes"
kind = "RESOLUTION"
owner = "DEM"
source = "assumed"
source_ref = "The first ages of the classes a household's key holds its persons in: children by bands of six years to the age of majority, adults by classes that part working life from retirement and old age. A resolution setting, changed by measuring the budget (N8.5); every rule that reads an age adds its boundary."
value = [0, 6, 12, 18, 35, 50, 65, 80]

[[primitive]]
id = "DEM.cell_budget"
kind = "RESOLUTION"
owner = "DEM"
source = "assumed"
source_ref = "The most household cells the representation keeps before tolerance control widens their steps: the architecture's sizing of about two million cells for the world's households (N8), set by measuring the budget."
value = 2000000
