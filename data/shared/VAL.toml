# Outlooks (spec VAL): how parties forecast, the parameters of the heuristic menu's rules and of switching between
# them, the experience weighting of long means, and the attention a surprise wakes. The menu itself is a standing
# SHAPE: no mechanism of the world derives the rules deciders use, so it is the accepted stand-in from the
# experimental and behavioural literature, listed with its sources in SHAPES.toml.

[[primitive]]
id = "VAL.memory_types"
kind = "RESOLUTION"
owner = "VAL"
source = "assumed"
source_ref = "Resolution (NUM.4): the adaptive gain's distribution cut into four memory types, each a quarter of its mass at its conditional mean, enough to tell slow from fast learners; a finer cut costs one method per type and series."
value = 4

[[primitive]]
id = "VAL.adaptive_gain"
kind = "PREFERENCE"
owner = "VAL"
source = "measured"
source_ref = "The share of the last surprise an adaptive outlook takes in at each print, beta: its mean 0.65, the linear rule estimated for the subjects of the converging groups of Hommes et al.'s learning-to-forecast experiments (Anufriev and Hommes 2012, American Economic Journal: Microeconomics 4(4); Hommes 2011, Journal of Economic Dynamics and Control 35(1), p. 29); its spread across people, a standard deviation of 0.126, the adaptive participants' individually estimated first-order rules in Heemeijer, Hommes, Sonnemans and Tuinstra (2009, Journal of Economic Dynamics and Control 33(5), Appendix C, Table 3: the gain α1/(α1+α2) of the seven positive-feedback participants with an adaptive term, mean 0.517, standard deviation 0.126): a = 8.66, b = 4.67."
value = { family = "beta", discretisation = "equal_shares", a = "8.66", b = "4.67" }

[[primitive]]
id = "VAL.trend_gamma"
kind = "PREFERENCE"
owner = "VAL"
source = "measured"
source_ref = "How far the trend rule extrapolates the last change: 0.4, the weak trend rule of Anufriev and Hommes (2012, American Economic Journal: Microeconomics 4(4)), the smallest trend coefficient estimated for the individual forecasters of Hommes et al. (2005) (Hommes 2011, Journal of Economic Dynamics and Control 35(1), p. 29)."
value = "0.4"

[[primitive]]
id = "VAL.anchor_kappa"
kind = "PREFERENCE"
owner = "VAL"
source = "measured"
source_ref = "How far the anchor rule pulls toward its level at each print: a half, the anchoring and adjustment rule of Anufriev and Hommes (2012, American Economic Journal: Microeconomics 4(4)), which forecasts halfway between the last value and the long mean."
value = "0.5"

[[primitive]]
id = "VAL.experience_theta"
kind = "PREFERENCE"
owner = "VAL"
source = "measured"
source_ref = "The exponent of the lived-years weights: 3.04, the weighting Malmendier and Nagel (2016, Learning from inflation experiences, Quarterly Journal of Economics 131(1)) estimated from the Michigan Survey of Consumers' inflation expectations by age, 1953-2009."
value = "3.04"

[[primitive]]
id = "VAL.performance_memory"
kind = "PREFERENCE"
owner = "VAL"
source = "assumed"
source_ref = "The weight of the last error in a heuristic's performance record: 0.3, one less the memory of 0.7 of Anufriev and Hommes' heuristic-switching model, a value they chose by trial-and-error simulation of their experiments, not an estimate (Hommes 2011, Journal of Economic Dynamics and Control 35(1), p. 29, note 13); no study measures it across people."
value = "0.3"

[[primitive]]
id = "VAL.switching_types"
kind = "RESOLUTION"
owner = "VAL"
source = "assumed"
source_ref = "Resolution (NUM.4): the switching intensity's distribution cut into three types, each a third of its mass at its conditional mean, enough to tell slow switchers from fast ones."
value = 3

[[primitive]]
id = "VAL.switching_intensity"
kind = "PREFERENCE"
owner = "VAL"
source = "assumed"
source_ref = "How strongly a party moves toward the heuristic that has forecast best, per squared error in the method's widths, gamma: its mean 0.4, the intensity of Anufriev and Hommes' heuristic-switching model, chosen by trial-and-error simulation of their experiments (Hommes 2011, Journal of Economic Dynamics and Control 35(1), p. 29, note 13); its spread, a standard deviation of 0.2 (shape 4, scale 0.1), assumed: the experiments estimate the intensity on aggregate choices only (Anufriev, Bao and Tuinstra 2016, Journal of Economic Behavior and Organization 129, note 22)."
value = { family = "gamma", discretisation = "equal_shares", shape = "4", scale = "0.1" }

[[primitive]]
id = "VAL.attention_sensitivity"
kind = "PREFERENCE"
owner = "VAL"
source = "estimated"
source_ref = "How many widths a surprise must exceed to wake the parties it bears on (REP.35): 0.78, the width being the mean absolute surprise, 0.798 standard deviations of a normal surprise. Between 40.15 and 52.83 per cent of the New York Fed's Survey of Consumer Expectations respondents shown new information do not revise their expectations (Armantier, Nelson, Topa, van der Klaauw and Zafar 2016, Review of Economics and Statistics 98(3); Staff Report 543, p. 12); a normal surprise stays within 0.62 standard deviations 46.5 per cent of the time, the middle of that range, which is 0.78 widths."
value = "0.78"

[[primitive]]
id = "VAL.heuristics_tracked"
kind = "SHAPE"
owner = "VAL"
source = "assumed"
source_ref = "The menu's four rules, adaptive, trend, anchor and announcement (VAL.6), each scored on every print of the series it forecasts."
shape = "standing:how people forecast: no mechanism in the world derives the rules deciders use, so the menu is the accepted stand-in from the experimental and behavioural literature"
value = 4

[[primitive]]
id = "VAL.age_windows"
kind = "RESOLUTION"
owner = "VAL"
source = "assumed"
source_ref = "Resolution (NUM.4): the first ages of the classes whose lived years weight a public series' history — under 35, 35 to 54, 55 and over, the age groups (18-34, 35-54, 55 and over) by which the University of Michigan's Surveys of Consumers, whose inflation expectations Malmendier and Nagel (2016) read, report; the first class begins at birth so that every age has one. A finer cut costs one method per class and series."
value = [0, 35, 55]
