[package]
name = "phx-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "phx"
path = "src/main.rs"

[dependencies]
clap.workspace = true
if-pop = { path = "../../interfaces/if-pop" }
phx-core = { path = "../../kernel/phx-core" }
phx-exec = { path = "../../kernel/phx-exec" }
phx-fin = { path = "../phx-fin" }
phx-geo = { path = "../../kernel/phx-geo" }
phx-id = { path = "../../foundation/phx-id" }
phx-num = { path = "../../foundation/phx-num" }
phx-obs = { path = "../../assembly/phx-obs" }
phx-pop = { path = "../../kernel/phx-pop" }
phx-rand = { path = "../../foundation/phx-rand" }
phx-store = { path = "../../kernel/phx-store" }
phx-world = { path = "../../assembly/phx-world" }
sys-sta = { path = "../../systems/sys-sta" }
if-state = { path = "../../interfaces/if-state" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true

[features]
# The bench's build: every allocation counted, so the trace can tell a span's allocations.
bench = ["phx-exec/bench"]
