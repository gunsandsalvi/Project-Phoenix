[package]
name = "phx-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
phx-core = { path = "../../kernel/phx-core" }
phx-exec = { path = "../../kernel/phx-exec" }
phx-id = { path = "../../foundation/phx-id" }
phx-ledger = { path = "../../kernel/phx-ledger" }
phx-num = { path = "../../foundation/phx-num" }
phx-pop = { path = "../../kernel/phx-pop" }
phx-rand = { path = "../../foundation/phx-rand" }
phx-store = { path = "../../kernel/phx-store" }
phx-obs = { path = "../../assembly/phx-obs" }
phx-world = { path = "../../assembly/phx-world" }
serde.workspace = true
toml.workspace = true
uniffi.workspace = true

[lints]
workspace = true
