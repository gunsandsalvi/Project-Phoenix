name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: The gate (npm run check), build, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate CLAUDE.md names, run as one thing: lint, typecheck, tests, spec citations, plan
      # progress. CI used to list five of its six by hand and omit `plan:check`, so a stale progress
      # block passed here and failed locally. A list in two places is a list that drifts (Law 4).
      - run: npm run check
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: App smoke test
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
