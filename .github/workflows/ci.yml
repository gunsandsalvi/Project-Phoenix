name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: The gate (Rust kernel and repository checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repository currently ships the Rust kernel and documentation tooling. Web build, browser
      # smoke, Pages and Android jobs return with the application rather than pretending an absent
      # packages/app can be built.
      - run: npm run check
      - run: npm run check:clippy
