name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo test --workspace

  # The world runs in the release profile, whose full optimisation can build code that the debug profile's tests
  # never see; the same tests run there too.
  test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo test --workspace --release

  phx-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: phx-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo run -q -p phx-check -- all

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned versions
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import tomllib
          v = tomllib.load(open("tools/versions.toml", "rb"))
          print(f"NIGHTLY={v['nightly']['miri']}")
          EOF
      - run: rustup toolchain install "$NIGHTLY" --profile minimal -c miri -c rust-src
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: miri-${{ hashFiles('Cargo.lock', 'tools/versions.toml') }}
      - run: cargo "+$NIGHTLY" miri test -p phx-store

  public-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Read pinned versions
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import tomllib
          v = tomllib.load(open("tools/versions.toml", "rb"))
          print(f"NIGHTLY={v['nightly']['public_api']}")
          print(f"PUBLIC_API_VERSION={v['cargo']['cargo-public-api']}")
          EOF
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-public-api
            target
          key: public-api-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/versions.toml') }}
      - run: cargo public-api --version | grep -q "$PUBLIC_API_VERSION" || cargo install cargo-public-api --version "$PUBLIC_API_VERSION" --locked --force
      - run: cargo run -q -p phx-check -- public-api

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Read pinned versions
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import tomllib
          v = tomllib.load(open("tools/versions.toml", "rb"))
          print(f"NDK_VERSION={v['android']['ndk']}")
          print(f"MIN_API={v['android']['min_api']}")
          print(f"CARGO_NDK_VERSION={v['cargo']['cargo-ndk']}")
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: android-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/versions.toml') }}
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - run: cargo ndk --version | grep -q "$CARGO_NDK_VERSION" || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --force
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" cargo ndk -t arm64-v8a --platform "$MIN_API" build --workspace

  android-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Read pinned versions
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import tomllib
          v = tomllib.load(open("tools/versions.toml", "rb"))
          print(f"NDK_VERSION={v['android']['ndk']}")
          print(f"MIN_API={v['android']['min_api']}")
          print(f"COMPILE_PLATFORM={v['android']['compile_platform']}")
          print(f"BUILD_TOOLS={v['android']['build_tools']}")
          print(f"CARGO_NDK_VERSION={v['cargo']['cargo-ndk']}")
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
          key: android-app-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/versions.toml', 'android/gradle/**') }}
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;$COMPILE_PLATFORM" "build-tools;$BUILD_TOOLS" > /dev/null
      - run: cargo ndk --version | grep -q "$CARGO_NDK_VERSION" || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --force
      - name: Build the engine for the phone
        run: PHX_COMMIT="$GITHUB_SHA" ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" cargo ndk -t arm64-v8a --platform "$MIN_API" -o android/app/src/main/jniLibs build --profile device -p phx-ffi
      - name: Write the Kotlin bindings
        run: cargo run -q -p phx-ffi --features bindgen --bin uniffi-bindgen -- generate --library target/aarch64-linux-android/device/libphx_ffi.so --language kotlin --out-dir android/app/src/main/java --no-format
      - name: Build the bench app
        working-directory: android
        run: ./gradlew --no-daemon assembleBenchRelease
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-bench-apk
          path: android/app/build/outputs/apk/bench/release/*.apk
          if-no-files-found: error

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Read pinned versions
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import tomllib
          v = tomllib.load(open("tools/versions.toml", "rb"))
          print(f"VALGRIND_VERSION={v['valgrind']['version']}")
          print(f"GUNGRAUN_VERSION={v['cargo']['gungraun-runner']}")
          EOF
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/gungraun-runner
            target
          key: bench-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/versions.toml') }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - run: valgrind --version | grep -q "$VALGRIND_VERSION"
      - run: gungraun-runner --version | grep -q "$GUNGRAUN_VERSION" || cargo install gungraun-runner --version "$GUNGRAUN_VERSION" --locked --force
      # The cached target keeps summaries of benchmarks since renamed or removed, which the ratchets would read as
      # this commit's counts, so only this run's summaries are left to read.
      - run: rm -rf target/gungraun
      - run: GUNGRAUN_SAVE_SUMMARY=json cargo bench --workspace
      - run: cargo run -q -p phx-check -- bench-ratchets
