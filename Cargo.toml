[workspace]
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
gungraun = "0.19.4"
libc = "0.2.189"
libm = "0.2.16"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
rayon-core = "1.13.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "visit", "extra-traits"] }
toml = "0.9.8"
trybuild = "1.0.121"
uniffi = "0.32.2"
zstd = { version = "0.14.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = "line-tables-only"

[profile.device]
inherits = "release"
lto = "fat"

[profile.bench]
inherits = "release"
