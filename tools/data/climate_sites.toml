# The climate classes of the map and the places each is measured at, from NASA POWER's daily reanalysis, 1991-2020.
#
# A lowland class is a latitude band of five degrees and a distance to the sea: coastal (under 50 km), inland (50 to
# 300 km) or interior (beyond 300 km); a highland class is the band's mountains. The places are the Old World's,
# from the Atlantic coast to Central Asia and Siberia, two to a class where two fit. A class's number is its place in
# this file, from 0.

