# Every tool beyond the Rust toolchain, pinned to its release current when S0.01 started (2026-09-23).
# CI and the bench read these; a change here is a change of tool.

[android]
ndk = "30.0.16248370"
ndk_release = "r30"
min_api = 35
target_api = 37
# From API 37 the SDK names its platform packages with a minor version.
compile_platform = "android-37.0"
build_tools = "36.0.0"
jdk = 17
# The app's own pins live in android/gradle/libs.versions.toml (AGP 9.4.0, Kotlin 2.4.20, Compose BOM 2026.09.00,
# activity-compose 1.13.0) and android/gradle/wrapper (Gradle 9.7.1, checksum pinned).
gradle = "9.7.1"

[cargo]
cargo-ndk = "4.1.2"
cargo-public-api = "0.52.0"

[nightly]
# The rustdoc JSON that cargo-public-api reads needs a nightly toolchain; the same date serves Miri.
public_api = "nightly-2026-09-22"
miri = "nightly-2026-09-22"

[ci]
runner = "ubuntu-24.04"

[python]
# The data tools under tools/data/, each a pip package: the derivations read with pandas and numpy; the fetchers read
# spreadsheets with openpyxl (xlsx) and xlrd (the older xls), PDFs with pymupdf and R data files with pyreadr.
pandas = "3.0.6"
numpy = "2.4.6"
openpyxl = "3.1.5"
xlrd = "2.0.2"
pymupdf = "1.28.2"
pyreadr = "0.5.6"
